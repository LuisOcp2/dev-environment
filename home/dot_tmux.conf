# ~/.tmux.conf - terminal multiplexer configuration.
#
# Managed by chezmoi. First version is intentionally plugin free: everything
# here works with a stock tmux install on Ubuntu, TuxedoOS and Debian.
#
# Prefix key: C-a (the default). Everything below documents what changed.
#
# Reload without restarting:  tmux source-file ~/.tmux.conf

# ---------------------------------------------------------------------------
# Core options
# ---------------------------------------------------------------------------

# History limit per pane. Increase with `set-option -g history-limit 100000`.
set -g history-limit 50000

# Start at window 1 so the numbering matches what is on screen.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing one.
setw -g renumber-windows on

# Faster escape-time: tmux stops swallowing Escape for a whole second.
set -sg escape-time 10

# Mouse support: on by default, easy to disable per session with
#   tmux set -g mouse off
set -g mouse on

# True colour, with a graceful fallback for TERM values that lack it.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Do not switch the shell in copy mode unless the user asks for it.
setw -g mode-keys vi

# Focus events reach the application running inside tmux.
setw -g focus-events on

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

# Reload the configuration file.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes keeping the current working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with vim keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between windows with vim keys.
bind < Up>   previous-window
bind < Down> next-window

# Window navigation by number, with a sane gap before renumbering.
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# Copy mode: start scrolling with vim keys.
bind [ copy-mode

# Create a window without the interactive rename prompt.
bind c new-window

# Kill a pane without a confirmation prompt (undo is still possible with the
# tmux respawn history, so this is recoverable).
bind x kill-pane

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-style "fg=colour244,bg=colour235"

# Left: session name, or the basename of the current directory.
set -g status-left "#[fg=colour15,bold] #S #[default]"

# Right: prefix hint, date, host and load average.
set -g status-right "#[fg=colour244]prefix C-a | %d %b %Y #[default]#[fg=colour15]%H:%M #[default]"

# Active window: bright. Inactive windows: dim. No colour overload.
setw -g window-status-current-style "fg=colour15,bg=colour24,bold"
setw -g window-status-style "fg=colour244,bg=colour235"

setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders: simple and readable.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour15"

# Keep the pane title visible for long running commands.
set -g allow-rename on

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------

# New sessions start at a 90% sized window so the status bar never hides a
# prompt, and the pane index is restored.
set -g default-size 90%

# Ask before killing a session that still has windows attached elsewhere.
set -g confirm-before -"saving the session"

# Auto rename the window from the running command, so `npm run dev` is easy
# to find later.
setw -g automatic-rename on